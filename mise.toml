[tools]
python = "3.13"

[tasks.assets]
description = "Fetch the Sponza scene into assets/ (not tracked by git)"
run = "./scripts/fetch_sponza.sh"

[tasks.check]
description = "Check Markdown links and the legacy manifest"
run = "python scripts/check.py"

[tasks.clean]
description = "Remove generated build and output directories"
run = "rm -rf build out"

[tasks.build]
description = "Bundle the native runner into build/"
run = "npx esbuild src/native/main.ts --bundle --platform=node --format=esm --target=node22 --outfile=build/native/main.mjs --external:webgpu --external:pngjs --external:jpeg-js --log-level=warning"

[tasks.typecheck]
description = "Type-check the TypeScript sources"
run = "npx tsc -p ."

[tasks."s0:native"]
description = "S0: Sponza G-buffer at 1080p with GPU timestamps, native Dawn (Vulkan)"
depends = ["build"]
run = "bash scripts/run_with_vulkan.sh node build/native/main.mjs"

[tasks."build:rc"]
description = "Bundle the radiance-cascade native runner (S1, S2) into build/"
run = "npx esbuild src/native/rc.ts --bundle --platform=node --format=esm --target=node22 --outfile=build/native/rc.mjs --external:webgpu --external:pngjs --external:jpeg-js --log-level=warning"

[tasks."s1:native"]
description = "S1: radiance cascades over the depth buffer at 1080p (world probes, screen probes, ray splitting), native Dawn"
depends = ["build:rc"]
run = "bash scripts/run_with_vulkan.sh node build/native/rc.mjs --out out/s1/native"

[tasks."s2:native"]
description = "S2: radiance cascades with voxel StrataBrick / triangle BVH interval tracers, native Dawn"
depends = ["build:rc"]
run = "bash scripts/run_with_vulkan.sh node build/native/rc.mjs"

[tasks."ref:export"]
description = "Export a scene (from our glTF parse) for the Mitsuba reference: PLY per material + scene.json into out/mitsuba/<scene>"
run = "npx esbuild src/native/mitsuba_export.ts --bundle --platform=node --format=esm --target=node22 --outfile=build/native/mitsuba_export.mjs --external:webgpu --external:pngjs --external:jpeg-js --log-level=warning && node build/native/mitsuba_export.mjs"

[tasks."ref:compare"]
description = "Compare dumped irradiance (--dump-irr) with a Mitsuba reference PFM"
run = "npx esbuild src/native/compare_ref.ts --bundle --platform=node --format=esm --target=node22 --outfile=build/native/compare_ref.mjs --external:webgpu --external:pngjs --external:jpeg-js --log-level=warning && node build/native/compare_ref.mjs"
