[tools]
cmake = "4.4.3"
ninja = "1.13.2"
python = "3.13"

[env]
CMAKE_GENERATOR = "Ninja"
PHOS_GI_BUILD_DIR = "build/release"

[tasks.assets]
description = "Fetch the Sponza research scene"
run = "./scripts/fetch_sponza.sh"

[tasks.configure]
description = "Configure the Release build"
run = 'cmake -S . -B "$PHOS_GI_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release'

[tasks.build]
description = "Build phos-gi-lab and shaders"
depends = ["configure"]
run = 'cmake --build "$PHOS_GI_BUILD_DIR"'

[tasks.bench]
description = "Run the Sponza cache-locality benchmark"
depends = ["build", "assets"]
usage = '''
flag "--queries <queries>" help="Number of cache queries" default="4000000"
flag "--iterations <iterations>" help="Timed dispatch iterations" default="100"
flag "--validation" help="Enable Vulkan validation layers"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=(
  --scene assets/Vulkan-Samples-Assets/scenes/sponza/Sponza01.gltf
  --queries "${usage_queries?}"
  --iterations "${usage_iterations?}"
)
if [ "${usage_validation:-false}" = "true" ]; then
  args+=(--validation)
fi
exec bash ./scripts/run_with_vulkan.sh "$PHOS_GI_BUILD_DIR/phos-gi-lab" "${args[@]}"
'''

[tasks."bench:synthetic"]
description = "Run the cache-locality benchmark without downloading Sponza"
depends = ["build"]
usage = '''
flag "--queries <queries>" help="Number of cache queries" default="4000000"
flag "--iterations <iterations>" help="Timed dispatch iterations" default="100"
flag "--validation" help="Enable Vulkan validation layers"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=(
  --synthetic
  --queries "${usage_queries?}"
  --iterations "${usage_iterations?}"
)
if [ "${usage_validation:-false}" = "true" ]; then
  args+=(--validation)
fi
exec bash ./scripts/run_with_vulkan.sh "$PHOS_GI_BUILD_DIR/phos-gi-lab" "${args[@]}"
'''


[tasks."bench:sweep"]
description = "Run the reproducible M0 benchmark matrix and save artifacts"
depends = ["build", "assets"]
usage = '''
flag "--query-counts <query_counts>" help="Comma-separated query counts" default="100000,500000,1000000,4000000,8000000"
flag "--iterations <iterations>" help="Timed dispatch iterations per process" default="100"
flag "--repeats <repeats>" help="Process-level repeats per query count" default="3"
flag "--validation" help="Enable Vulkan validation layers"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=(
  --query-counts "${usage_query_counts?}"
  --iterations "${usage_iterations?}"
  --repeats "${usage_repeats?}"
)
if [ "${usage_validation:-false}" = "true" ]; then
  args+=(--validation)
fi
exec python scripts/benchmark_matrix.py "${args[@]}"
'''

[tasks."bench:sweep:synthetic"]
description = "Run the reproducible M0 matrix with the synthetic workload"
depends = ["build"]
usage = '''
flag "--query-counts <query_counts>" help="Comma-separated query counts" default="100000,500000,1000000,4000000,8000000"
flag "--iterations <iterations>" help="Timed dispatch iterations per process" default="100"
flag "--repeats <repeats>" help="Process-level repeats per query count" default="3"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec python scripts/benchmark_matrix.py \
  --synthetic \
  --query-counts "${usage_query_counts?}" \
  --iterations "${usage_iterations?}" \
  --repeats "${usage_repeats?}"
'''

[tasks.clean]
description = "Remove generated build files"
run = 'cmake -E remove_directory build'


[tasks."research:check"]
description = "Validate the research harness layout and result indexes"
run = "python scripts/research/verify.py"

[tasks."research:record"]
description = "Run one lane experiment and capture a reproducible raw artifact"
usage = '''
flag "--lane <lane>" help="research lane id, including lane-j-topology-backend-alternatives" required=#true
flag "--experiment <experiment>" help="Stable experiment id, e.g. 001-producer-stream" required=#true
flag "--command <command>" help="Command to execute; quote it as one shell argument" required=#true
'''
run = '''
exec python scripts/research/run_experiment.py \
  --lane "${usage_lane?}" \
  --experiment "${usage_experiment?}" \
  --command "${usage_command?}"
'''


[tasks."research:j003:probe"]
description = "Run the Lane J J003 representative target-GPU traversal probe"
depends = ["configure"]
usage = '''
flag "--snapshot <snapshot>" help="Frozen J002 snapshot" default="out/research/lane-j-topology-backend-alternatives/002-deterministic-topology-contract/materialized/medium-global-representative/step-00.bin"
flag "--output <output>" help="Probe JSON output" default="out/research/lane-j-topology-backend-alternatives/003-target-gpu-prototype/j003-traversal-probe.json"
flag "--ray-count <ray_count>" help="Validation ray count" default="4096"
flag "--validation" help="Enable Vulkan validation layers"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
cmake --build "$PHOS_GI_BUILD_DIR" --target phos-lane-j-j003-probe
args=(
  --snapshot "${usage_snapshot?}"
  --output "${usage_output?}"
  --ray-count "${usage_ray_count?}"
)
if [ "${usage_validation:-false}" = "true" ]; then
  args+=(--validation)
fi
exec bash ./scripts/run_with_vulkan.sh \
  "$PHOS_GI_BUILD_DIR/phos-lane-j-j003-probe" \
  "${args[@]}"
'''


[tasks."research:j003:transition-parity"]
description = "Replay J003 C++ transition state and compare with the canonical Python structural gate"
depends = ["configure"]
usage = '''
flag "--profile <profile>" help="Frozen J002 profile" default="medium-global-representative"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
profile="${usage_profile?}"
artifact_root="out/research/lane-j-topology-backend-alternatives/002-deterministic-topology-contract/materialized"
cpp_output="out/research/lane-j-topology-backend-alternatives/003-target-gpu-prototype/j003-cpp-transition-${profile}.json"

cmake --build "$PHOS_GI_BUILD_DIR" \
  --target phos-lane-j-contract-test phos-lane-j-j003-transition-replay

"$PHOS_GI_BUILD_DIR/phos-lane-j-contract-test"

"$PHOS_GI_BUILD_DIR/phos-lane-j-j003-transition-replay" \
  --profile-dir "$artifact_root/$profile" \
  --output "$cpp_output"

python scripts/research/lane_j_topology_backend_alternatives/compare_j003_transition_replay.py \
  --canonical "$artifact_root/j003-cpu-structural.json" \
  --cpp "$cpp_output" \
  --profile "$profile"
'''


[tasks."research:j003:persistent-layout"]
description = "Replay the frozen J003 profiles through the persistent physical-slot layout"
depends = ["configure"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

artifact_root="out/research/lane-j-topology-backend-alternatives/002-deterministic-topology-contract/materialized"
output_root="out/research/lane-j-topology-backend-alternatives/003-target-gpu-prototype/persistent-layout"

cmake --build "$PHOS_GI_BUILD_DIR" \
  --target phos-lane-j-contract-test phos-lane-j-j003-persistent-layout-replay

"$PHOS_GI_BUILD_DIR/phos-lane-j-contract-test"

profiles=(
  small-global-high
  medium-global-representative
  medium-local-high
  large-global-high
  large-local-high
)

mkdir -p "$output_root"
for profile in "${profiles[@]}"; do
  echo "=== $profile ==="
  "$PHOS_GI_BUILD_DIR/phos-lane-j-j003-persistent-layout-replay" \
    --profile-dir "$artifact_root/$profile" \
    --output "$output_root/$profile.json"
done
'''


[tasks."research:j003:persistent-gpu"]
description = "Replay the representative J003 profile through persistent Vulkan buffers"
depends = ["configure"]
usage = '''
flag "--profile <profile>" help="Frozen J002 profile" default="medium-global-representative"
flag "--ray-count <ray_count>" help="Exact validation ray count per snapshot" default="4096"
flag "--validation" help="Enable Vulkan validation layers"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

profile="${usage_profile?}"
artifact_root="out/research/lane-j-topology-backend-alternatives/002-deterministic-topology-contract/materialized"
output_root="out/research/lane-j-topology-backend-alternatives/003-target-gpu-prototype/persistent-gpu"
mkdir -p "$output_root"

cmake --build "$PHOS_GI_BUILD_DIR"   --target phos-lane-j-j003-persistent-gpu-replay

args=(
  --profile-dir "$artifact_root/$profile"
  --output "$output_root/$profile.json"
  --ray-count "${usage_ray_count?}"
)
if [ "${usage_validation:-false}" = "true" ]; then
  args+=(--validation)
fi

exec bash ./scripts/run_with_vulkan.sh   "$PHOS_GI_BUILD_DIR/phos-lane-j-j003-persistent-gpu-replay"   "${args[@]}"
'''


[tasks."research:j003:persistent-gpu-all"]
description = "Replay all frozen J003 profiles through one persistent Vulkan build"
depends = ["configure"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

artifact_root="out/research/lane-j-topology-backend-alternatives/002-deterministic-topology-contract/materialized"
output_root="out/research/lane-j-topology-backend-alternatives/003-target-gpu-prototype/persistent-gpu-all"
mkdir -p "$output_root"

cmake --build "$PHOS_GI_BUILD_DIR"   --target phos-lane-j-j003-persistent-gpu-replay

profiles=(
  small-global-high
  medium-global-representative
  medium-local-high
  large-global-high
  large-local-high
)

for profile in "${profiles[@]}"; do
  echo "=== $profile ==="
  bash ./scripts/run_with_vulkan.sh     "$PHOS_GI_BUILD_DIR/phos-lane-j-j003-persistent-gpu-replay"     --profile-dir "$artifact_root/$profile"     --output "$output_root/$profile.json"     --ray-count 4096     --validation
done

echo "J003 persistent GPU all-profile campaign PASS"
'''

[tasks."research:j004:memory-preflight"]
description = "Run the frozen J004 same-run Lane-E HWRT relative-memory eligibility gate"
depends = ["configure"]
usage = '''
flag "--root <root>" help="Frozen J002 materialized root" default="out/research/lane-j-topology-backend-alternatives/002-deterministic-topology-contract/materialized"
flag "--output <output>" help="Optional JSON output path"
flag "--validation" help="Enable Vulkan validation layers"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

cmake --build "$PHOS_GI_BUILD_DIR" \
  --target phos-lane-j-j004-memory-preflight

args=(--root "${usage_root?}")

if [ -n "${usage_output:-}" ]; then
  args+=(--output "${usage_output}")
elif [ -z "${PHOS_RESEARCH_ARTIFACT_DIR:-}" ]; then
  output="out/research/lane-j-topology-backend-alternatives/004-formal-crossover/j004-relative-memory-preflight.json"
  mkdir -p "$(dirname "$output")"
  args+=(--output "$output")
fi

if [ "${usage_validation:-false}" = "true" ]; then
  args+=(--validation)
fi

exec bash ./scripts/run_with_vulkan.sh \
  "$PHOS_GI_BUILD_DIR/phos-lane-j-j004-memory-preflight" \
  "${args[@]}"
'''
